[build]
  publish = "."
  functions = "netlify/functions"

# Clean URLs — accessible without .html extension
[[redirects]]
  from = "/neural"
  to   = "/mind_map_neural_view.html"
  status = 200

[[redirects]]
  from = "/brain"
  to   = "/mind_map_neural_view.html"
  status = 200

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "SAMEORIGIN"
